services:

  # Provided mock API service
  mock-api:
    image: meetrj/callzo-mock-usage-api
    platform: linux/arm64
    container_name: mock-api
    ports:
      - "8001:8001"
    restart: unless-stopped

  # Your production frontend service
  frontend:
    image: vanshikagupta2006/callzo-task2-frontend:1.0.0
    container_name: callzo-frontend
    ports:
      - "3000:3000"
    depends_on:
      - mock-api
    restart: unless-stopped